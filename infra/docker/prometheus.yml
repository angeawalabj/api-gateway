global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: api-gateway
    static_configs:
      - targets: [gateway:9090]
    metrics_path: /metrics
    scrape_interval: 5s

  # Pas de job "upstreams" ici : service-a/b/c sont des backends de demo
  # (services/upstream) qui n'exposent que /health en JSON, pas de
  # /metrics au format Prometheus. Un scrape avec metrics_path: /health
  # échoue au parsing et affiche ces cibles comme "down" en permanence,
  # ce qui donne une fausse alerte plutôt qu'un vrai signal de sante.
