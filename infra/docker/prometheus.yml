global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: api-gateway
    static_configs:
      - targets: [gateway:9090]
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: upstreams
    static_configs:
      - targets: [service-a:8081, service-b:8082, service-c:8083]
    metrics_path: /health
    scrape_interval: 30s
